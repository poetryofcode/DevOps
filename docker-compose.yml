# oh so if we do some changes in docerk-compose.yml for example in frontend contaiener then if we run docker-compose up then it will restart only frontend container but other containers like backend nad db will be running. Yes exactly. docker compose up -d compares the current running state with the new docker-compose.yml and only restarts containers where something changed.

# in this case looks like it is rear when we need to run docker compose down. Yes, docker compose down is rarely needed. You'd use it when: Completely removing everything — wiping the stack to start fresh

# So todo-front is always running, waiting for requests. nginx just forwards traffic to it.

# oh. so we starting first our app with docker compose up on vps
#and later when user go to our url it just show content
#Yes exactly.

#docker compose up -d starts everything once. Then the containers just sit there running 24/7 waiting for requests.

#That's the whole point of -d (detached) — containers run in the background permanently, not just while you're connected to the VPS.

#When a user visits the site — nginx forwards the request to the already-running container, gets the response, sends it back. The container was already there waiting.

